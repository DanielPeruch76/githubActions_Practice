name: Testing and Building my app
on: push
jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - name: getting the code
        uses: actions/checkout@v6
      - name: installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24.4.0'
      - name: installing dependencies
        run : npm install
      - name: testing app
        run: npm test
  build:
    runs-on: ubuntu-slim
    steps:
      - name: getting the code
        uses: actions/checkout@v6
      - name: installing node
        uses: actions/setup-node@v6
        with:
          node-version: '24.4.0'
      - name: installing dependencies
        run: npm install
      - name: start my app
        run: npm run build